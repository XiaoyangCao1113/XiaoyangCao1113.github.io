name: Update profile affiliations

on:
  push:
    branches:
      - affiliations-idss-first

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affiliations-idss-first
      - name: Update affiliations
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_role = '<p class="role">M.S. student at MIT, in <a href="https://cse.mit.edu/">Computational Science <span class="amp">&amp;</span> Engineering</a> and <a href="https://tpp.mit.edu/">Technology <span class="amp">&amp;</span> Policy</a></p>'
          new_role = '<p class="role">M.S. student at MIT <a href="https://idss.mit.edu/">IDSS</a>, <a href="https://cse.mit.edu/">CCSE</a>, and <a href="https://lids.mit.edu/">LIDS</a></p>'
          old_meta = '<p class="meta"><a href="https://lids.mit.edu/">MIT LIDS</a> · Cambridge, MA</p>'
          new_meta = '<p class="meta">Cambridge, MA</p>'
          old_bio = '<p>Hi! I’m a master’s student at MIT, affiliated with <a href="https://lids.mit.edu/">LIDS</a> and advised by <a href="https://miba.dev/">Michiel Bakker</a>. Before MIT, I received my B.S. in Mathematics and Physics from <a href="https://www.tsinghua.edu.cn/en/">Tsinghua University</a> in 2025.</p>'
          new_bio = '<p>Hi! I’m a master’s student at MIT. I am affiliated with the <a href="https://idss.mit.edu/">Institute for Data, Systems, and Society (IDSS)</a>, the <a href="https://cse.mit.edu/">Center for Computational Science and Engineering (CCSE)</a>, and the <a href="https://lids.mit.edu/">Laboratory for Information and Decision Systems (LIDS)</a>. I am advised by <a href="https://miba.dev/">Michiel Bakker</a>. Before MIT, I received my B.S. in Mathematics and Physics from <a href="https://www.tsinghua.edu.cn/en/">Tsinghua University</a> in 2025.</p>'
          for old, new in [(old_role,new_role),(old_meta,new_meta),(old_bio,new_bio)]:
              if old not in s:
                  raise SystemExit('Expected text not found')
              s = s.replace(old,new,1)
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align MIT affiliations as IDSS, CCSE, and LIDS"
          git push origin HEAD:affiliations-idss-first
