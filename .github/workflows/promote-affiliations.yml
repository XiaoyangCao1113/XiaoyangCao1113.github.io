name: Promote affiliations update

on:
  push:
    branches:
      - affiliations-idss-first

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affiliations-idss-first
          fetch-depth: 0
      - name: Remove temporary workflow and promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-affiliations.yml
          git commit -m "Remove temporary promotion workflow"
          git push origin HEAD:affiliations-idss-first
          git push origin HEAD:master
