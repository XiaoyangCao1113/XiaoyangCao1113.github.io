name: Finalize CV deployment

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/finalize-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install corrected CV and update website link
        shell: bash
        run: |
          set -euo pipefail

          base64 --decode files/CV_Xiaoyang_Cao_2026.pdf.b64 > files/CV_Xiaoyang_Cao_2026.pdf
          test "$(head -c 4 files/CV_Xiaoyang_Cao_2026.pdf)" = "%PDF"
          test "$(stat -c%s files/CV_Xiaoyang_Cao_2026.pdf)" -gt 5000

          # Keep the old URL correct as well, while the homepage moves to a new cache-safe URL.
          cp files/CV_Xiaoyang_Cao_2026.pdf files/CV_Xiaoyang_Cao.pdf

          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          old = "/files/CV_Xiaoyang_Cao.pdf"
          new = "/files/CV_Xiaoyang_Cao_2026.pdf"

          if new not in html:
              if old not in html:
                  raise SystemExit("CV link not found in index.html")
              html = html.replace(old, new, 1)
              path.write_text(html, encoding="utf-8")
          PY

          rm files/CV_Xiaoyang_Cao_2026.pdf.b64
          rm .github/workflows/finalize-cv.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix CV display and use cache-safe link"
          git push origin HEAD:master
